name: Publish assets to S3
description: >-
  Authenticate to AWS with OIDC, upload built assets to S3, and invalidate the
  matching CloudFront paths so the change is visible. No long-lived credentials
  are involved.

  The calling job must declare `permissions: id-token: write`, which a composite
  action cannot do on its own.

inputs:
  role-to-assume:
    description: >-
      ARN of the role to assume via OIDC. The role's trust policy must name the
      calling repository's subject claim -- it is repo-specific, so a role that
      works for one repository will not work for another without an entry.
    required: true
  aws-region:
    description: AWS region.
    required: false
    default: us-west-2
  bucket:
    description: S3 bucket name.
    required: true
  prefix:
    description: Key prefix within the bucket, without leading or trailing slash.
    required: true
  sources:
    description: >-
      Directories to upload, one per line. A directory named `dist` uploads to
      the prefix root; anything else uploads to a subdirectory of that name.
    required: false
    default: |
      dist
      css
  distribution-id:
    description: CloudFront distribution to invalidate. Omit to skip invalidation.
    required: false
    default: ""
  acl:
    description: >-
      Object ACL. Defaults to public-read because the media bucket is in legacy
      ObjectWriter mode with no bucket policy, so public read comes entirely
      from per-object ACLs. Set to "none" once a bucket policy exists.
    required: false
    default: public-read
  public-base-url:
    description: >-
      Public URL the prefix is served from, with a trailing slash. When set,
      the job summary links every published file. S3 website endpoints have no
      directory listing, so naming the files is the only way to link them.
    required: false
    default: ""
  dry-run:
    description: Show what would be uploaded and invalidated, and change nothing.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Publish
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
        PREFIX: ${{ inputs.prefix }}
        SOURCES: ${{ inputs.sources }}
        DISTRIBUTION: ${{ inputs.distribution-id }}
        ACL: ${{ inputs.acl }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        ARGS=(--bucket "$BUCKET" --prefix "$PREFIX" --acl "$ACL")
        ARGS+=(--manifest "$RUNNER_TEMP/published.txt")
        [ -n "$DISTRIBUTION" ] && ARGS+=(--distribution "$DISTRIBUTION")
        [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
        while IFS= read -r line; do
          [ -n "$line" ] && ARGS+=(--source "$line")
        done <<< "$SOURCES"
        "${{ github.action_path }}/../../../bin/publish-to-s3.sh" "${ARGS[@]}"

    - name: Summarize
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
        PREFIX: ${{ inputs.prefix }}
        BASE_URL: ${{ inputs.public-base-url }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        MANIFEST="$RUNNER_TEMP/published.txt"
        COUNT="$(grep -c . "$MANIFEST" 2>/dev/null || echo 0)"
        {
          echo "### S3 publish${DRY_RUN:+ (dry run)}"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| bucket | \`$BUCKET\` |"
          echo "| prefix | \`$PREFIX\` |"
          echo "| files | $COUNT |"
          echo "| dry run | $DRY_RUN |"
          echo
          if [ -n "$BASE_URL" ] && [ "$COUNT" -gt 0 ]; then
            echo "#### Published files"
            echo
            sort "$MANIFEST" | head -n 40 | while IFS= read -r key; do
              [ -n "$key" ] && echo "- [\`$key\`](${BASE_URL%/}/$key)"
            done
            [ "$COUNT" -gt 40 ] && echo "- …and $((COUNT - 40)) more"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
